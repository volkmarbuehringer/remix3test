# Nightly Safari-engine coverage.
#
# The default CI run stays on Chromium + Firefox. This job is opt-in through
# the env-gated `webkit` project in playwright.config.ts and the test:webkit
# scripts, so a WebKit regression cannot lengthen the main quality-check run.
#
# Playwright WebKit is engine coverage, not the Safari app: the browser support
# floor remains Safari/iOS 18.2+. Run it manually from the Actions tab (or
# `gh workflow run webkit.yml`) after changing frame traversal, scroll
# restoration, view transitions, or Playwright.
name: WebKit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: webkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit:
    # Keep this in sync with ci.yml; `--with-deps` supplies ICU 74 and the
    # jpeg/gstreamer libraries Playwright WebKit needs on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SESSION_SECRET: ci-session-secret-not-for-production
      SEED_ADMIN_PASSWORD: ci-admin-password
      SEED_USER_PASSWORD: ci-user-password
      PUBLIC_ORIGIN: http://localhost:44100
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm test:webkit
