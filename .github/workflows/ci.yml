# Manual remix-preview and quality check.
#
# Run from the Actions tab (or `gh workflow run ci.yml`) when validating a
# dependency bump or a broad change. This workflow is intentionally not
# scheduled and does not run on push.
#
# Main preview releases are pruned after ~7 days, so run `pnpm remix:pin:check`
# around a bump: it fails when a pinned asset is gone or the lock resolves a
# different release, and warns when a newer upstream preview exists or the pin
# crosses the five-day refresh window.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pin the image: `ubuntu-latest` is migrating to Ubuntu 26 and emits a
    # runner-image notice on every run.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SESSION_SECRET: ci-session-secret-not-for-production
      SEED_ADMIN_PASSWORD: ci-admin-password
      SEED_USER_PASSWORD: ci-user-password
      PUBLIC_ORIGIN: http://localhost:44100
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check remix preview pin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm remix:pin:check

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm test
